# Local development services for Uptrail. The application itself runs on the host (./mvnw spring-boot:run).
# Default credentials below are for local development only; override them in a .env file (see .env.example).
name: uptrail

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: uptrail
      MYSQL_USER: ${UPTRAIL_DB_USER:-uptrail}
      MYSQL_PASSWORD: ${UPTRAIL_DB_PASSWORD:-uptrail_dev_password}
      MYSQL_ROOT_PASSWORD: ${UPTRAIL_DB_ROOT_PASSWORD:-uptrail_root_dev_password}
      TZ: UTC
    ports:
      # Host port 3307 avoids clashing with a MySQL server already installed on 3306.
      - "127.0.0.1:${UPTRAIL_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${UPTRAIL_MAIL_PORT:-1025}:1025"
      - "127.0.0.1:${UPTRAIL_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  mysql-data:
