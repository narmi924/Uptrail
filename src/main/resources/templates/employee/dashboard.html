<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page('Dashboard', 'dashboard', ~{::#page})}">
<body>
<div id="page">
  <div class="ut-page-header">
    <div>
      <h1 th:text="'Welcome, ' + ${profile.fullName}">Welcome</h1>
      <div class="ut-subtitle" th:text="${profile.department} + ' · ' + ${profile.designation.label()}">Department</div>
    </div>
    <div class="ut-actions">
      <a class="btn btn-primary" th:href="@{/employee/applications/new}">Apply for a Course</a>
    </div>
  </div>

  <div class="ut-strip state-critical" th:if="${profile.approverId == null}">
    <div class="ut-strip-title">No approver is configured for you.</div>
    Applications cannot be submitted until an administrator assigns your approving manager.
  </div>

  <div class="ut-card">
    <div class="ut-card-header"><h2>Your profile</h2></div>
    <div class="ut-card-body">
      <dl class="ut-dl">
        <dt>Staff number</dt><dd class="mono" th:text="${profile.staffNo}">S0001</dd>
        <dt>Email</dt><dd th:text="${profile.email}">email</dd>
        <dt>Approving manager</dt>
        <dd th:text="${profile.approverName != null} ? ${profile.approverName} : 'Not configured'">Manager</dd>
      </dl>
    </div>
  </div>
</div>
</body>
</html>
