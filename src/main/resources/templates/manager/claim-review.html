<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page('Review fee claim', 'approvals', ~{::#page})}">
<body>
<div id="page">
  <div class="ut-breadcrumb"><a th:href="@{/manager/claims}">Fee claims</a></div>
  <div th:replace="~{fragments/claim :: header(${claim})}"></div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div th:replace="~{fragments/claim :: course(${claim}, @{/manager/team/applications/{id}(id=${claim.application.id})})}"></div>
      <div th:replace="~{fragments/claim :: documents(${claim}, @{/claims/documents/})}"></div>
      <div th:replace="~{fragments/claim :: outcome(${claim})}"></div>

      <div class="ut-card" id="decision">
        <div class="ut-card-header"><h2>Decision</h2></div>
        <div class="ut-card-body">
          <p class="mb-0 text-muted-ut" th:if="${!claim.actions.canDecide}" th:text="${claim.actions.decisionNote}">No decision needed.</p>
          <form th:if="${claim.actions.canDecide}" method="post"
                th:action="@{/manager/claims/{id}/decision(id=${claim.id})}"
                data-ut-confirm="Record this decision? The claimant is notified by email with your reason.">
            <input type="hidden" name="expectedVersion" th:value="${claim.version}">
            <fieldset class="mb-3">
              <legend class="form-label">Decision <span class="ut-required">(required)</span></legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="decision" id="decision-approve" value="APPROVE"
                       required th:checked="${decisionDraft != null and decisionDraft.name() == 'APPROVE'}">
                <label class="form-check-label" for="decision-approve">Approve</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="decision" id="decision-reject" value="REJECT"
                       th:checked="${decisionDraft != null and decisionDraft.name() == 'REJECT'}">
                <label class="form-check-label" for="decision-reject">Reject</label>
              </div>
            </fieldset>
            <label class="form-label" for="reason">Reason <span class="ut-required">(required for both decisions)</span></label>
            <textarea class="form-control mb-2" id="reason" name="reason" rows="3" maxlength="2000" required
                      th:text="${reasonDraft}"
                      placeholder="Approving: documents checked. Rejecting: what the claimant should correct."></textarea>
            <div class="ut-form-actions mt-2">
              <button type="submit" class="btn btn-primary">Record decision</button>
              <span class="ut-action-note">Check that the receipt and certificate match the course and the amount before approving.</span>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div th:replace="~{fragments/application :: timeline(${claim.timeline})}"></div>
    </div>
  </div>
</div>
</body>
</html>
