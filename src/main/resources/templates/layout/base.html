<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, nav, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <title th:text="${title} + ' · Uptrail'">Uptrail</title>
  <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
  <link rel="preload" th:href="@{/fonts/inter-latin-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/uptrail.css}">
  <!-- Deferred scripts run in document order, so page scripts placed in the content run after these. -->
  <script defer th:src="@{/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js}"></script>
  <script defer th:src="@{/js/uptrail.js}"></script>
</head>
<body th:with="navUser=${currentUser}, home=${currentUser != null and currentUser.adminWorkspace} ? @{/admin/home} : @{/staff/home}">
<a class="visually-hidden-focusable" href="#main">Skip to content</a>

<!-- Top bar for small screens; on wide screens the sidebar is always visible. -->
<header class="ut-topbar" th:if="${navUser != null}">
  <button type="button" class="ut-icon-button ut-menu-toggle" aria-controls="ut-sidenav" aria-expanded="false"
          aria-label="Open navigation" data-ut-toggle="sidenav">
    <svg th:replace="~{fragments/ui :: icon('menu')}"></svg>
  </button>
  <a class="ut-brand" th:href="${home}"><img class="ut-brand-mark" th:src="@{/img/logo.svg}" alt="">Uptrail</a>
  <span class="ut-topbar-spacer"></span>
  <span class="ut-avatar" th:text="${navUser.initials}" th:title="${navUser.displayName}">U</span>
</header>

<div class="ut-shell" th:classappend="${navUser == null} ? 'ut-shell-bare'">
  <nav class="ut-sidenav" id="ut-sidenav" aria-label="Main navigation" th:if="${navUser != null}">
    <div class="ut-sidenav-brand">
      <a class="ut-brand" th:href="${home}"><img class="ut-brand-mark" th:src="@{/img/logo.svg}" alt="">Uptrail</a>
      <span class="ut-workspace" th:text="${navUser.adminWorkspace} ? 'Administration' : 'Staff workspace'">Staff workspace</span>
    </div>

    <div class="ut-sidenav-scroll">
      <th:block th:if="${!navUser.adminWorkspace}">
        <div class="ut-nav-group" th:if="${navUser.employee}">
          <div class="ut-nav-heading">My training</div>
          <a th:replace="~{fragments/ui :: navLink('dashboard', @{/staff/home}, 'layout-dashboard', 'Dashboard', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('applications', @{/staff/applications}, 'file-text', 'My Applications', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('apply', @{/staff/applications/new}, 'circle-plus', 'Apply for a Course', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('claims', @{/staff/claims}, 'receipt', 'My Claims', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('entitlement', @{/staff/entitlement}, 'wallet', 'My Entitlement', 0)}"></a>
        </div>
        <div class="ut-nav-group" th:if="${navUser.manager}">
          <a th:replace="~{fragments/ui :: navLink('manager-home', @{/manager/home}, 'layout-dashboard', 'Manager Dashboard', 0)}"></a>
          <div class="ut-nav-heading">Team</div>
          <a th:replace="~{fragments/ui :: navLink('approvals', @{/manager/approvals}, 'inbox', 'Approvals', ${navUser.counts.approvals})}"></a>
          <a th:replace="~{fragments/ui :: navLink('team', @{/manager/team/history}, 'history', 'Team History', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('reports', @{/manager/reports}, 'chart-column', 'Reports', 0)}"></a>
        </div>
      </th:block>
      <th:block th:if="${navUser.adminWorkspace}">
        <div class="ut-nav-group">
          <div class="ut-nav-heading">Administration</div>
          <a th:replace="~{fragments/ui :: navLink('admin-dashboard', @{/admin/home}, 'layout-dashboard', 'Dashboard', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('staff', @{/admin/staff}, 'users', 'Staff', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('routing', @{/admin/routing}, 'route', 'Approval Routing', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('entitlements', @{/admin/entitlements}, 'sliders-horizontal', 'Entitlements', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('catalogue', @{/admin/catalogue}, 'book-open', 'Catalogue', 0)}"></a>
          <a th:replace="~{fragments/ui :: navLink('holidays', @{/admin/holidays}, 'flag', 'Public Holidays', 0)}"></a>
        </div>
        <div class="ut-nav-group">
          <div class="ut-nav-heading">Finance and operations</div>
          <a th:replace="~{fragments/ui :: navLink('reimbursements', @{/admin/reimbursements}, 'banknote', 'Reimbursements', ${navUser.counts.registrations})}"></a>
          <a th:replace="~{fragments/ui :: navLink('operations', @{/admin/operations}, 'activity', 'Operations', 0)}"></a>
        </div>
      </th:block>
      <div class="ut-nav-group">
        <div class="ut-nav-heading">Shared</div>
        <a th:replace="~{fragments/ui :: navLink('calendar', @{/calendar}, 'calendar-days', 'Training Calendar', 0)}"></a>
      </div>
    </div>

    <div class="ut-sidenav-footer">
      <span class="ut-avatar" th:text="${navUser.initials}" aria-hidden="true">U</span>
      <div class="ut-navUser">
        <div class="ut-user-name" th:text="${navUser.displayName}">Name</div>
        <div class="ut-user-roles" th:text="${navUser.rolesLabel}">User</div>
      </div>
      <form method="post" class="ut-inline" th:action="${navUser.adminWorkspace} ? @{/admin/logout} : @{/logout}">
        <button type="submit" class="ut-icon-button" aria-label="Sign out" title="Sign out">
          <svg th:replace="~{fragments/ui :: icon('log-out')}"></svg>
        </button>
      </form>
    </div>
  </nav>
  <div class="ut-backdrop" data-ut-backdrop="sidenav" th:if="${navUser != null}"></div>

  <main class="ut-content" id="main">
    <div class="ut-content-inner">
      <div th:replace="~{fragments/messages :: flash}"></div>
      <th:block th:replace="${content}"></th:block>
    </div>
  </main>
</div>

</body>
</html>
