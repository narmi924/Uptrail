name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compile, unit and MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare Maven Wrapper
        run: chmod +x mvnw
      - name: Compile
        run: ./mvnw -B -ntp -DskipTests compile
      - name: Run unit and MySQL integration tests
        run: ./mvnw -B -ntp verify
